<!DOCTYPE html><html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>启动中</title>
  <style nonce="__TAURI_STYLE_NONCE__">
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #1e6bd2;
      color: #ffffff;
      user-select: none;
    }
    body {
      display: flex;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      min-height: 100%;
      padding: 32px 24px 28px;
      text-align: center;
    }
    .splash-icon {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 22%;
      margin-bottom: 20px;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.18));
    }
    .splash-name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }
    .splash-version {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.82);
      margin-bottom: 28px;
    }
    .splash-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .splash-loader span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      animation: splash-bounce 1.2s ease-in-out infinite;
    }
    .splash-loader span:nth-child(2) { animation-delay: 0.15s; }
    .splash-loader span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes splash-bounce {
      0%, 80%, 100% { transform: scale(0.65); opacity: 0.45; }
      40% { transform: scale(1); opacity: 1; }
    }
    .splash-status {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.82);
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="splash" data-tauri-drag-region="">
    <img class="splash-icon" src="assets/icon-64.png" width="96" height="96" alt="" decoding="async" fetchpriority="high">
    <h1 class="splash-name" id="splashName">Cursor助手</h1>
    <p class="splash-version" id="splashVersion"></p>
    <div class="splash-loader" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <p class="splash-status" id="splashStatus">加载中，请稍候…</p>
  </div>
  <script>
    (function () {
      function applyAppInfo(info) {
        if (!info || !info.success) {
          return;
        }
        if (info.name) {
          document.getElementById('splashName').textContent = info.name;
          document.title = info.name;
        }
        if (info.version) {
          document.getElementById('splashVersion').textContent = '版本 ' + info.version;
        }
      }

      async function loadAppInfo() {
        try {
          var invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
          if (!invoke) {
            return;
          }
          applyAppInfo(await invoke('get_app_info'));
        } catch (e) {
          console.warn('[splash] load app info failed', e);
        }
      }

      loadAppInfo();

      try {
        if (window.__TAURI__ && window.__TAURI__.event && window.__TAURI__.event.listen) {
          window.__TAURI__.event.listen('splash-status', function (event) {
            var el = document.getElementById('splashStatus');
            if (el && event.payload) {
              el.textContent = event.payload;
            }
          });
        }
      } catch (e) {
        console.warn('[splash] event listen failed', e);
      }
    })();
  </script>


</body></html>
