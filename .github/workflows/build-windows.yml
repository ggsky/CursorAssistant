name: Build Windows App

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否发布 GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri App
        run: tauri build

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          
          # 收集独立可执行文件
          if (Test-Path "src-tauri/target/release/cursor-assist.exe") {
            Copy-Item "src-tauri/target/release/cursor-assist.exe" -Destination "dist/"
          }
          
          # 收集 NSIS 安装包 (Setup.exe)
          if (Test-Path "src-tauri/target/release/bundle/nsis/*.exe") {
            Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" -Destination "dist/"
          }
          
          # 收集 MSI 安装包
          if (Test-Path "src-tauri/target/release/bundle/msi/*.msi") {
            Copy-Item "src-tauri/target/release/bundle/msi/*.msi" -Destination "dist/"
          }
          
          Write-Host "打包输出文件列表："
          Get-ChildItem -Path dist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cursor-assist-windows
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
